<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 · 우리들의 방명록</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="setup-warning" class="alert error" style="display:none; max-width:460px; margin:24px auto 0; position:relative; z-index:1;"></div>

  <main class="page">
    <section class="card">
      <div class="brand" style="margin-bottom:18px;">
        <span class="dot"></span>
        <span>우리들의 방명록</span>
      </div>

      <!-- 로그인 / 회원가입 전환 -->
      <div class="tabs" role="tablist">
        <button class="tab active" id="tab-login" type="button">로그인</button>
        <button class="tab" id="tab-signup" type="button">회원가입</button>
      </div>

      <!-- 안내 메시지 표시 영역 -->
      <div id="alert" style="display:none;"></div>

      <form id="auth-form" novalidate>
        <div class="field">
          <label for="email">이메일</label>
          <input id="email" class="input" type="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input id="password" class="input" type="password" placeholder="6자 이상" minlength="6"
            autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn primary block" id="submit-btn">로그인</button>
      </form>

      <p class="text-center mt-2">
        <a class="muted-link" href="index.html">← 방명록 보러 가기</a>
      </p>
    </section>

    <footer class="footer">Supabase Auth로 로그인/회원가입을 처리합니다.</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
