<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>중부권광역우편물류센터</title>
  <link rel="stylesheet" href="css/node-navigation.css" />
  <style>
    /* ---- 메인 페이지 전용 ---- */
    .main-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px 20px;
    }

    .main-title {
      text-align: center;
    }
    .main-title h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .main-title p {
      font-size: 0.88rem;
      color: var(--dim);
    }

    .main-buttons {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .main-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 260px;
      height: 220px;
      border: 2px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.22s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }
    .main-btn:nth-child(2) { animation-delay: 0.08s; }

    .main-btn:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
      border-color: rgba(43, 108, 255, 0.6);
    }

    .main-btn .btn-icon {
      font-size: 3.2rem;
      line-height: 1;
    }
    .main-btn .btn-label {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .main-btn .btn-desc {
      font-size: 0.78rem;
      color: var(--dim);
      text-align: center;
      line-height: 1.4;
      padding: 0 12px;
    }

    /* 좌 버튼 포인트 색상 */
    .main-btn.left:hover {
      border-color: rgba(43, 108, 255, 0.8);
      box-shadow: 0 16px 48px rgba(43, 108, 255, 0.25), 0 0 0 3px rgba(43, 108, 255, 0.15);
    }
    /* 우 버튼 포인트 색상 */
    .main-btn.right:hover {
      border-color: rgba(138, 75, 255, 0.8);
      box-shadow: 0 16px 48px rgba(138, 75, 255, 0.25), 0 0 0 3px rgba(138, 75, 255, 0.15);
    }

    @media (max-width: 600px) {
      .main-btn { width: 220px; height: 190px; }
      .main-title h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <!-- 상단 바 (동일 구조) -->
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <div class="brand-text">
        <b>중부권광역우편물류센터</b>
        <span class="brand-sub">메인</span>
      </div>
    </div>
  </header>

  <!-- 메인 본문 -->
  <main class="main-layout">
    <div class="main-title">
      <h1>중부권광역우편물류센터</h1>
      <p>원하는 기능을 선택하세요</p>
    </div>

    <div class="main-buttons">
      <a href="node-navigation.html" class="main-btn left">
        <span class="btn-icon">🗺️</span>
        <span class="btn-label">노선 조회</span>
        <span class="btn-desc">최적 노선 계산 및 지도 경로 표시</span>
      </a>
      <a href="node-compare.html" class="main-btn right">
        <span class="btn-icon">📊</span>
        <span class="btn-label">노선 비교</span>
        <span class="btn-desc">여러 노선의 거리·시간 비교 분석</span>
      </a>
    </div>
  </main>
</body>
</html>
