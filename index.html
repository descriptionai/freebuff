<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리들의 방명록</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="setup-warning" class="alert error" style="display:none; max-width:720px; margin:24px auto 0; position:relative; z-index:1;"></div>

  <main class="wrap">
    <!-- 상단 바 -->
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <span>우리들의 방명록</span>
      </div>
      <div id="user-box" class="user-box" style="display:none;">
        <span>👤 <b id="user-name"></b></span>
        <button class="mini-btn" id="logout-btn" type="button">로그아웃</button>
      </div>
    </header>

    <section class="card">
      <h1>한 줄 남기고 가세요 ✍️</h1>
      <p class="subtitle">로그인 후 글을 남길 수 있어요. 모두가 볼 수 있는 열린 방명록입니다.</p>

      <!-- 글 작성 폼 (로그인 시에만 표시) -->
      <form id="write-form" style="display:none;">
        <div class="field">
          <label for="content">메시지</label>
          <textarea id="content" class="textarea" maxlength="1000"
            placeholder="자유롭게 한 줄을 남겨보세요…"></textarea>
          <div class="char-count"><span id="count">0</span> / 1000</div>
        </div>
        <button type="submit" class="btn primary block" id="submit-btn">남기기</button>
      </form>

      <!-- 로그인 유도 (비로그인 시에만 표시) -->
      <div id="login-cta" class="alert info" style="display:none;">
        글을 남기려면 로그인이 필요해요.
        <a class="btn primary" href="login.html" style="margin-top:12px;">로그인 / 회원가입 →</a>
      </div>
    </section>

    <!-- 메시지 목록 -->
    <section id="list-section" aria-live="polite">
      <div id="loader" class="loader">
        <div class="spinner"></div>
        불러오는 중…
      </div>
      <div id="list" class="list"></div>
    </section>

    <footer class="footer">
      Supabase DB · Vercel Hosting · <span id="foot-count"></span>
    </footer>
  </main>

  <div id="toasts" class="toast-wrap"></div>

  <!-- 스크립트 로드 순서: supabase CDN → 설정 → 클라이언트 → 앱 로직 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
